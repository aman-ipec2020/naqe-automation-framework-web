name: Playwright Tests

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      Profile:
        description: 'Profile to run tests against'
        required: true
        default: 'framework'
      Environment:
        description: 'Environment to run tests against'
        required: true
        default: 'config'
        type: choice
        options:
          - UAT1
          - UAT2
      Browser:
        description: 'Browser to run tests against'
        required: true
        default: 'firefox'
        type: choice
        options:
          - firefox
          - chromium
          - webkit
          - safari

jobs:
    test:
      timeout-minutes: 60
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '17'
        - name: Build & Install
          run: mvn -B clean install -DskipTests --no-transfer-progress
        - name: Ensure browser binaries are installed
          run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
        - name: Run Playwright Tests
          run: mvn test -Pframework -DEnv=${{ github.event.inputs.Environment }} -Dbrowser=${{ github.event.inputs.Browser }}